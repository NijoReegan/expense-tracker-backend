spring.application.name=et-server
server.port=${PORT:8089}

# PostgreSQL connection (values loaded from environment or ./et-server/.env). Never hardcode credentials.
spring.datasource.url=${DB_URL:}
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=${DB_DDL_AUTO:update}
spring.jpa.open-in-view=false

# Graceful shutdown for hosted platforms (Render restarts during deploys).
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

# Jackson: serialize java.time as ISO-8601 strings
spring.jackson.serialization.write-dates-as-timestamps=false

# JWT
jwt.secret=${JWT_SECRET:}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Frontend origin(s) allowed by CORS (comma-separated; Spring origin patterns allowed)
app.frontend-urls=${FRONTEND_URL:}
# Allow every Vercel deployment URL (production + per-commit previews). Dev convenience only.
app.allow-vercel-previews=${ALLOW_VERCEL_PREVIEWS:false}
# Public Swagger UI / OpenAPI docs. Set to false in production to avoid exposing the API surface.
app.expose-api-docs=${EXPOSE_API_DOCS:true}

logging.level.org.hibernate=warn
